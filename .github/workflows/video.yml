name: Video harian

on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 WIB, slot pagi
    - cron: "0 5 * * *"   # 12:00 WIB, slot siang
    - cron: "0 11 * * *"  # 18:00 WIB, slot sore
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot video"
        type: choice
        options: [auto, pagi, siang, sore]
        default: auto
      uji:
        description: "Mode uji (tidak upload, tidak dicatat)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: video-harian
  cancel-in-progress: false

jobs:
  buat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Siapkan login YouTube
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then
            mkdir -p secrets
            printf '%s' "$YT_TOKEN_JSON" > secrets/token.json
          fi

      - name: Tentukan slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 0 * * *") echo "slot=pagi" >> "$GITHUB_OUTPUT" ;;
              "0 5 * * *") echo "slot=siang" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * *") echo "slot=sore" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=auto" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bikin video
        id: video
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_UPLOAD: ${{ vars.YT_UPLOAD || '0' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'KerjaPakaiAI' }}
        run: python main.py --slot "${{ steps.slot.outputs.slot }}" ${{ inputs.uji && '--uji' || '' }}

      - name: Simpan riwayat topik
        id: riwayat
        if: success() && !inputs.uji
        run: |
          git config user.name "kerjapakaiai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Riwayat video $(TZ=Asia/Jakarta date +%F) ${{ steps.slot.outputs.slot }}"
            git pull --rebase
            git push
          fi

      - name: Kabari kalau riwayat gagal disimpan
        if: steps.video.outcome == 'success' && steps.riwayat.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from kpai import telegram; telegram.kirim_pesan('Video sudah terkirim, tapi riwayat topik gagal disimpan. Janji video berikutnya bisa putus. Cek Actions.')"

      - name: Simpan video sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.txt
            output/**/naskah.json
          retention-days: 7
          if-no-files-found: ignore
